name: Deploy System Architect OS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, don't cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Static Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Derive basePath for project page
        id: basepath
        shell: bash
        run: |
          # Project pages (user.github.io/<repo>) need basePath = /<repo>
          # User pages (user.github.io) need basePath = ""
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.event.repository.owner.login }}"
          if [ "$REPO" = "$OWNER.github.io" ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$REPO" >> "$GITHUB_OUTPUT"
          fi
          echo "Derived basePath: $(cat $GITHUB_OUTPUT | cut -d= -f2)"

      - name: Build Next.js static export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.base }}
        run: bun run build:static

      - name: Verify index.html exists
        run: |
          if [ ! -f "./out/index.html" ]; then
            echo "::error::out/index.html not found after build!"
            exit 1
          fi
          echo "✓ out/index.html exists ($(wc -c < ./out/index.html) bytes)"
          echo "✓ out/.nojekyll exists: $([ -f ./out/.nojekyll ] && echo yes || echo no)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
