name: Deploy System Architect OS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Static Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: false          # We deploy manually via deploy-pages
          origin_path_prefix: ""      # Detects user.github.io/repo-name

      - name: Derive basePath from pages_url
        id: basepath
        run: |
          # If repo is a project page (not <user>.github.io), Pages serves from /<repo>/
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.event.repository.owner.login }}"
          if [ "$REPO" != "$OWNER.github.io" ]; then
            echo "base=/$REPO" >> $GITHUB_OUTPUT
          else
            echo "base=" >> $GITHUB_OUTPUT
          fi

      - name: Build Next.js static export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.base }}
        run: bun run build:static

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
